name: Link Check Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create smoke-test input
        shell: bash
        run: |
          mkdir -p smoke-test
          cat > smoke-test/broken-links.md <<'EOF'
          # Link Check Smoke Test

          This workflow intentionally includes a broken URL to verify the notification path.

          - https://example.invalid/broken-test
          EOF

      - name: Run Lychee smoke test
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: false
          jobSummary: true
          format: markdown
          output: lychee/smoke-test-out.md
          args: >
            --verbose
            smoke-test/broken-links.md

      - name: Append run link to smoke-test report
        if: steps.lychee.outputs.exit_code != 0
        shell: bash
        run: |
          {
            echo
            echo "---"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This smoke test is expected to fail because it checks a deliberately broken URL."
          } >> ./lychee/smoke-test-out.md

      - name: Create or update smoke-test issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          title="Automated broken links smoke test"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file ./lychee/smoke-test-out.md
          else
            gh issue create --title "$title" --body-file ./lychee/smoke-test-out.md
          fi

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-smoke-test-report
          path: ./lychee/smoke-test-out.md
          if-no-files-found: ignore
