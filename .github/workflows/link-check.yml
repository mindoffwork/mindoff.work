name: Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  lychee:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: link-check-lychee-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            link-check-lychee-${{ runner.os }}-${{ github.ref_name }}-
            link-check-lychee-${{ runner.os }}-

      - name: Run Lychee
        id: lychee
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p lychee
          set +e
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/lycheeverse/lychee:latest \
            --config .lychee.toml \
            --verbose \
            --root-dir /work/out \
            out > ./lychee/out.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare scheduled broken-links report
        if: steps.lychee.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "# Broken links detected during scheduled check"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Checked at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "Lychee exited with status `${{ steps.lychee.outputs.status }}`."
            echo
            echo "```text"
            cat ./lychee/out.txt
            echo "```"
          } > ./lychee/out.md

      - name: Create or update broken links issue
        if: steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken links report – scheduled"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file ./lychee/out.md
          else
            gh issue create --title "$title" --body-file ./lychee/out.md
          fi

      - name: Close broken links issue when healthy
        if: steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken links report – scheduled"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --body "The scheduled broken-links check passed in run $GITHUB_RUN_ID, so this report is being closed automatically."
            gh issue close "$issue_number"
          fi

      - name: Upload scheduled link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-daily-report
          path: |
            ./lychee/out.md
            ./lychee/out.txt
          if-no-files-found: ignore

      - name: Mark scheduled check failed when broken links are found
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "Broken links detected in scheduled check."
          exit 1
