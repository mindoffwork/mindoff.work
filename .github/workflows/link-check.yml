name: Link Check

on:
  workflow_dispatch:
    inputs:
      simulate_broken_link:
        description: "Inject one intentional broken exported URL to verify issue creation"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  lychee:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Set report context
        id: report_context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simulate_broken_link }}" = "true" ]; then
            echo "title=Broken links report - manual verification" >> "$GITHUB_OUTPUT"
            echo "mode=manual verification" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "title=Broken links report - on-demand" >> "$GITHUB_OUTPUT"
            echo "mode=on-demand check" >> "$GITHUB_OUTPUT"
          else
            echo "title=Broken links report - scheduled" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled check" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject verification broken link
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_broken_link == true
        shell: bash
        run: |
          mkdir -p out/__link-check-verification__
          cat > out/__link-check-verification__/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Broken Link Verification</title>
            </head>
            <body>
              <p>This page exists only to verify broken-link issue creation.</p>
              <a href="/__link-check-verification__/missing-page/">
                Intentional broken link verification target
              </a>
            </body>
          </html>
          EOF

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: link-check-lychee-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            link-check-lychee-${{ runner.os }}-${{ github.ref_name }}-
            link-check-lychee-${{ runner.os }}-

      - name: Run Lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          format: markdown
          output: lychee/out.md
          jobSummary: true
          args: >
            --config .lychee.toml
            --verbose
            --root-dir "${{ github.workspace }}/out"
            out

      - name: Prepare scheduled broken-links report
        if: steps.lychee.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p lychee
          if [ ! -s ./lychee/out.md ]; then
            cat > ./lychee/out.md <<'EOF'
          # Link checker failed during scheduled check

          The Lychee step failed, but it did not produce a broken-links report file.
          Open the linked Actions run and inspect the **Run Lychee** step for the exact tool error.
          EOF
          fi

          sed "s|file://${GITHUB_WORKSPACE}/out|https://mindoff.work|g" ./lychee/out.md > ./lychee/out-public.md

          {
            echo "# Broken links detected during ${{ steps.report_context.outputs.mode }}"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Checked at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simulate_broken_link }}" = "true" ]; then
              echo "Verification mode: enabled"
              echo
              echo "This run intentionally injected one fake broken exported URL so the GitHub issue path could be tested safely."
              echo
            fi
            echo "If the report below looks incomplete, open the **Run Lychee** step in this run for full details."
            echo
            cat ./lychee/out-public.md
          } > ./lychee/out-report.md

      - name: Create or update broken links issue
        if: steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="${{ steps.report_context.outputs.title }}"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file ./lychee/out-report.md
          else
            gh issue create --title "$title" --body-file ./lychee/out-report.md
          fi

      - name: Close broken links issue when healthy
        if: steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="${{ steps.report_context.outputs.title }}"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --body "The ${{ steps.report_context.outputs.mode }} passed in run $GITHUB_RUN_ID, so this report is being closed automatically."
            gh issue close "$issue_number"
          fi

      - name: Upload scheduled link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-daily-report
          path: |
            ./lychee/out.md
            ./lychee/out-public.md
            ./lychee/out-report.md
          if-no-files-found: ignore

      - name: Mark scheduled check failed when broken links are found
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "Broken links detected in scheduled check."
          exit 1
