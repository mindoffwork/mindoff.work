name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m ":bookmark: Bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:root

      - name: Build
        run: npm run build

      - name: Run Lychee pre-deploy gate
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: false
          jobSummary: true
          format: markdown
          output: lychee/predeploy-out.md
          args: >
            --config .lychee.toml
            --verbose
            --root-dir "${{ github.workspace }}/out"
            out

      - name: Append run link to release report
        if: steps.lychee.outputs.exit_code != 0
        shell: bash
        run: |
          {
            echo
            echo "---"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "If the summary below is too compact, open the **Run Lychee pre-deploy gate** step in that run for the full per-link log."
          } >> ./lychee/predeploy-out.md

      - name: Create or update broken links issue from release build
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Automated broken links report"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file ./lychee/predeploy-out.md
          else
            gh issue create --title "$title" --body-file ./lychee/predeploy-out.md
          fi

      - name: Close broken links issue when release build is healthy
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Automated broken links report"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --body "The release-build link check passed in run $GITHUB_RUN_ID, so this report is being closed automatically."
            gh issue close "$issue_number"
          fi

      - name: Upload release link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-release-report
          path: ./lychee/predeploy-out.md
          if-no-files-found: ignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: mindoff.work

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
