name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m ":bookmark: Bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:root

      - name: Build
        run: npm run build

      - name: Run Lychee pre-deploy gate
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          format: markdown
          output: lychee/predeploy-out.md
          jobSummary: true
          args: >
            --config .lychee.toml
            --verbose
            --root-dir "${{ github.workspace }}/out"
            out

      - name: Prepare release broken-links report
        if: steps.lychee.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p lychee
          if [ ! -s ./lychee/predeploy-out.md ]; then
            cat > ./lychee/predeploy-out.md <<'EOF'
          # Link checker failed during release build

          The Lychee step failed, but it did not produce a broken-links report file.
          Open the linked Actions run and inspect the **Run Lychee pre-deploy gate** step for the exact tool error.
          EOF
          fi

          {
            echo "# Broken links detected during release build"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "If the report below looks incomplete, open the **Run Lychee pre-deploy gate** step in this run for full details."
            echo
            cat ./lychee/predeploy-out.md
          } > ./lychee/predeploy-report.md

      - name: Check whether release report has broken-link details
        if: steps.lychee.outcome == 'failure'
        id: release_report
        shell: bash
        run: |
          if grep -q '\[ERROR\]' ./lychee/predeploy-out.md || grep -q '^| ' ./lychee/predeploy-out.md; then
            echo "has_broken_links=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_broken_links=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update broken links issue from release build
        if: steps.lychee.outcome == 'failure' && steps.release_report.outputs.has_broken_links == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken links report - v${{ steps.version.outputs.version }}"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file ./lychee/predeploy-report.md
          else
            gh issue create --title "$title" --body-file ./lychee/predeploy-report.md
          fi

      - name: Close broken links issue when release build is healthy
        if: steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken links report - v${{ steps.version.outputs.version }}"
          issue_number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number")"

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --body "The release-build link check passed in run $GITHUB_RUN_ID, so this report is being closed automatically."
            gh issue close "$issue_number"
          fi

      - name: Upload release link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-release-report
          path: |
            ./lychee/predeploy-out.md
            ./lychee/predeploy-report.md
          if-no-files-found: ignore

      - name: Stop release when broken links are found
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "Link check failed. Deployment has been stopped."
          exit 1

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: mindoff.work

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
